<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navbar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

    
        .navbar {
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .navbar ul li a:hover {
            color: #3498db;
        }

        
        @media screen and (max-width: 600px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .navbar ul {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }

        
        .konten {
            padding: 20px;
        }

        .wadah-kartu {
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .kartu {
            width: 100%;
            max-width: 250px;
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">SMK Hebat</div>
        <ul>
            <li><a href="#">Beranda</a></li>
            <li><a href="#jurusan">Jurusan</a></li>
            <li><a href="#">Kontak</a></li>
        </ul>
    </nav>

</body>
</html>
