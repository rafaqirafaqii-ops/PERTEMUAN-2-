
<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
    body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* BAPAK (Wadah Utama) */
        .wadah-kartu {
            display: flex;
            justify-content: space-evenly;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        /* ANAK (Masing-masing Kartu) */
        .kartu {
            width: 100%;
            max-width: 250px;
            margin-bottom: 20px;
            padding: 20px;
            border: 1px solid #cccccc;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #f9f9f9;
        }
    </style>
    
<body>

    <h2 style="text-align: center; margin-top: 40px;">Kompetensi Keahlian</h2>

    <!-- BAPAK (Wadah Utama) -->
    <div class="wadah-kartu">
        
        <!-- ANAK 1 -->
        <div class="kartu">
            <h3>RPL</h3>
            <p>Rekayasa Perangkat Lunak</p>
        </div>

        <!-- ANAK 2 -->
        <div class="kartu">
            <h3>TKJ</h3>
            <p>Teknik Komputer dan Jaringan</p>
        </div>

        <!-- ANAK 3 -->
        <div class="kartu">
            <h3>DKV</h3>
            <p>Desain Komunikasi Visual</p>
        </div>

    </div> <!-- Penutup BAPAK harus di paling bawah setelah semua anak -->

</body>
</html>
